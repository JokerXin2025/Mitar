[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Mitar"
version = "0.1.0"
description = "An automatic informalization tool for mathematical proofs in Lean4"

[project.scripts]
Mitar = "Mitar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Mitar"]